<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="440" height="260" overflow="hidden" role="img" aria-label="Network diagram with packets passing or being blocked by a WAF">

<style>
  :root{
    --panel:#161b22;--border:#30363d;--fg:#c9d1d9;--dim:#8b949e;
    --green:#3fb950;--green-dim:#1a3f2b;--red:#f85149;--red-dim:#3d1a1a;
    --yellow:#d29922;--blue:#58a6ff;--cyan:#39c5cf;--bg:#0d1117;
  }
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .panel{fill:var(--panel)}
  .edge{stroke:var(--border);stroke-width:1}
  .fg{fill:var(--fg)} .dim{fill:var(--dim)} .gr{fill:var(--green)}
  .rd{fill:var(--red)} .yl{fill:var(--yellow)} .bl{fill:var(--blue)} .cy{fill:var(--cyan)}
  .f10{font-size:10px} .f11{font-size:11px} .f12{font-size:12px} .f13{font-size:13px}
  @media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
<rect x="0" y="0" width="440" height="260" rx="10" class="panel"/>
<rect x="0.5" y="0.5" width="439" height="259" rx="10" fill="none" class="edge"/>
<defs></defs>

<text x="220" y="20" text-anchor="middle" class="dim f11">packet-filter --watch</text>

<circle cx="58" cy="132" r="19" style="fill:var(--panel)" class="edge"/>
<text x="58" y="136" text-anchor="middle" class="f10 fg">HOST</text>

<circle cx="382" cy="132" r="19" style="fill:var(--panel)" class="edge"/>
<text x="382" y="136" text-anchor="middle" class="f10 fg">API</text>
<line x1="79" y1="132" x2="207" y2="132" class="edge"/>
<line x1="233" y1="132" x2="361" y2="132" class="edge"/>
<rect x="207" y="80" width="26" height="104" rx="5" style="fill:var(--red-dim)" class="edge"/>
<line x1="209" y1="88" x2="231" y2="88" class="edge"/><line x1="209" y1="99" x2="231" y2="99" class="edge"/><line x1="209" y1="110" x2="231" y2="110" class="edge"/><line x1="209" y1="121" x2="231" y2="121" class="edge"/><line x1="209" y1="132" x2="231" y2="132" class="edge"/><line x1="209" y1="143" x2="231" y2="143" class="edge"/><line x1="209" y1="154" x2="231" y2="154" class="edge"/><line x1="209" y1="165" x2="231" y2="165" class="edge"/><line x1="209" y1="176" x2="231" y2="176" class="edge"/>
<text x="220" y="72" text-anchor="middle" class="rd f10">WAF</text>
<rect x="54" y="100" width="8" height="8" rx="1.5" class="gr" style="--dy:-28.0;animation:passMove 2.63s linear infinite;animation-delay:-4.30s"/><rect x="54" y="128" width="8" height="8" rx="1.5" class="gr" style="--dy:0.0;animation:passMove 4.16s linear infinite;animation-delay:-0.67s"/><rect x="54" y="156" width="8" height="8" rx="1.5" class="rd" style="--dy:28.0;animation:blockMove 4.53s linear infinite;animation-delay:-1.32s"/><rect x="54" y="100" width="8" height="8" rx="1.5" class="gr" style="--dy:-28.0;animation:passMove 3.49s linear infinite;animation-delay:-0.04s"/><rect x="54" y="128" width="8" height="8" rx="1.5" class="gr" style="--dy:0.0;animation:passMove 4.11s linear infinite;animation-delay:-3.58s"/><rect x="54" y="156" width="8" height="8" rx="1.5" class="rd" style="--dy:28.0;animation:blockMove 3.18s linear infinite;animation-delay:-1.92s"/><rect x="54" y="100" width="8" height="8" rx="1.5" class="gr" style="--dy:-28.0;animation:passMove 2.81s linear infinite;animation-delay:-1.84s"/><rect x="54" y="128" width="8" height="8" rx="1.5" class="gr" style="--dy:0.0;animation:passMove 4.09s linear infinite;animation-delay:-1.15s"/><rect x="54" y="156" width="8" height="8" rx="1.5" class="rd" style="--dy:28.0;animation:blockMove 4.57s linear infinite;animation-delay:-0.81s"/><rect x="54" y="100" width="8" height="8" rx="1.5" class="gr" style="--dy:-28.0;animation:passMove 4.02s linear infinite;animation-delay:-4.21s"/><rect x="54" y="128" width="8" height="8" rx="1.5" class="gr" style="--dy:0.0;animation:passMove 4.29s linear infinite;animation-delay:-1.75s"/><rect x="54" y="156" width="8" height="8" rx="1.5" class="rd" style="--dy:28.0;animation:blockMove 3.37s linear infinite;animation-delay:-0.66s"/>
<text x="58" y="240" text-anchor="middle" class="gr f10">allowed</text>
<text x="294" y="240" text-anchor="middle" class="rd f10">blocked</text>
<style>
  @keyframes passMove{
    from{transform:translate(0,var(--dy,0))}
    to{transform:translate(324px,var(--dy,0))}
  }
  @keyframes blockMove{
    0%{transform:translate(0,var(--dy,0))}
    45%{transform:translate(149px,var(--dy,0))}
    55%{transform:translate(140px,var(--dy,0))}
    100%{transform:translate(0,var(--dy,0))}
  }
</style>
</svg>
