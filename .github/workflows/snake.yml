name: Generate snake animation

on:
  push:
    branches: [main]
  schedule:
    # 22:17 UTC daily. GitHub disables scheduled workflows on public repos after
    # 60 days of no activity, so pushes refresh the image too.
    - cron: '17 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # v3 is required for the `outputs` input (multi-file, per-theme palettes).
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake-light.svg?palette=github-light

      - name: Verify game art and README wiring
        run: |
          npm ci
          npm test

      # The test suite runs the generator, so this catches the remaining drift
      # it cannot see on its own: art committed without regenerating it, or an
      # SVG edited by hand. The suite validates whatever is on disk, so a stale
      # file would otherwise pass as long as it is internally consistent.
      - name: Verify committed art matches generator output
        run: |
          npm run generate
          if ! git diff --exit-code --quiet -- games; then
            echo '::error::games/ does not match gen-game-art.js output. Run `npm run generate` and commit the result.'
            git diff --stat -- games
            exit 1
          fi

      - name: Commit generated SVGs
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --force dist
          if git diff --quiet --cached; then
            echo 'Snake SVG unchanged, nothing to commit.'
            exit 0
          fi
          git commit -m 'Update snake animation'
          # This push re-triggers this workflow, but the follow-up run sees an
          # unchanged SVG and exits at the `git diff --quiet` guard above, so it
          # terminates after one extra run rather than looping.
          git push origin HEAD:${{ github.ref_name }}