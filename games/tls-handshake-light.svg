<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="440" height="260" overflow="hidden" role="img" aria-label="TLS 1.3 handshake between a client and server">

<style>
  :root{
    --panel:#f6f8fa;--border:#d0d7de;--fg:#24292f;--dim:#59636e;
    --green:#1a7f37;--green-dim:#dafbe1;--red:#cf222e;--red-dim:#ffebe9;
    --yellow:#9a6700;--blue:#0969da;--cyan:#1b7c83;--bg:#ffffff;
  }
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .panel{fill:var(--panel)}
  .edge{stroke:var(--border);stroke-width:1}
  .fg{fill:var(--fg)} .dim{fill:var(--dim)} .gr{fill:var(--green)}
  .rd{fill:var(--red)} .yl{fill:var(--yellow)} .bl{fill:var(--blue)} .cy{fill:var(--cyan)}
  .f10{font-size:10px} .f11{font-size:11px} .f12{font-size:12px} .f13{font-size:13px}
  @media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
<rect x="0" y="0" width="440" height="260" rx="10" class="panel"/>
<rect x="0.5" y="0.5" width="439" height="259" rx="10" fill="none" class="edge"/>
<defs></defs>

<text x="220" y="20" text-anchor="middle" class="dim f11">openssl s_client -tls1_3 -connect lab.local:443</text>
<g class="msg" style="animation:msg 15s linear infinite both;animation-delay:0.00s"><line x1="84" y1="42" x2="356" y2="42" class="bl edge"/><text x="92" y="39" class="bl f10">ClientHello</text></g><g class="msg" style="animation:msg 15s linear infinite both;animation-delay:0.85s"><line x1="356" y1="59" x2="84" y2="59" class="bl edge"/><text x="348" y="56" class="bl f10">ServerHello</text></g><g class="msg" style="animation:msg 15s linear infinite both;animation-delay:1.70s"><line x1="356" y1="76" x2="84" y2="76" class="yl edge"/><text x="348" y="73" class="yl f10">Certificate</text></g><g class="msg" style="animation:msg 15s linear infinite both;animation-delay:2.55s"><line x1="84" y1="93" x2="356" y2="93" class="cy edge"/><text x="92" y="90" class="cy f10">Key exchange</text></g><g class="msg" style="animation:msg 15s linear infinite both;animation-delay:3.40s"><line x1="356" y1="110" x2="84" y2="110" class="gr edge"/><text x="348" y="107" class="gr f10">Finished</text></g>
<circle cx="62" cy="142" r="18" style="fill:var(--panel)" class="edge"/>
<text x="62" y="146" text-anchor="middle" class="fg f10">you</text>
<circle cx="378" cy="142" r="18" style="fill:var(--panel)" class="edge"/>
<text x="378" y="146" text-anchor="middle" class="fg f10">srv</text>
<text x="220" y="146" text-anchor="middle" class="lock f12">locked</text>
<text x="220" y="146" text-anchor="middle" class="lockdone f11">TLS_AES_256_GCM</text>
<text x="220" y="222" text-anchor="middle" class="dim f11">1-RTT handshake  ·  cert verified  ·  no downgrade</text>
<style>
  .msg{opacity:0}
  .lock{fill:var(--yellow)}
  .lockdone{fill:var(--green);opacity:0}
  @keyframes msg{0%{opacity:0}3%{opacity:1}26%{opacity:1}30%,100%{opacity:0}}
  /* The lock resolves only once every handshake step has been exchanged. */
  .lock{animation:lockColor 15s steps(1) infinite}
  .lockdone{animation:doneColor 15s steps(1) infinite}
  @keyframes lockColor{0%,29%{fill:var(--yellow)}30%,100%{fill:var(--green)}}
  @keyframes doneColor{0%,29%{opacity:0}30%,100%{opacity:1}}
</style>
</svg>
