name: Deploy profile site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Run game tests
        run: |
          npm install --no-save jsdom
          node test-snake.js

      # Publishing only snake/ puts the game at the site root and keeps the
      # repo's own files (tests, workflow) off the deployed site.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'snake'

      - id: deployment
        uses: actions/deploy-pages@v4